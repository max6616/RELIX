[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relix-core"
version = "1.0.0"
description = "RELIX diffraction indexing and its integrated-reflection simulator"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "torch", "sympy"]

[project.scripts]
relix = "relix.cli:main"

[tool.setuptools]
package-dir = {"" = "RELIX"}
py-modules = ["xrdt_workspace"]

[tool.setuptools.packages.find]
where = ["RELIX"]

[tool.setuptools.package-data]
lattice_aligned = ["assets/*.json"]
lattice_relation = ["assets/*.json"]

[project.urls]
Repository = "https://github.com/max6616/RELIX"
Releases = "https://github.com/max6616/RELIX/releases/tag/v1.0.0"
